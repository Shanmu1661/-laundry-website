  <body>
    <nav class="navbar navbar-expand-lg fixed-top" aria-label="Primary navigation">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">

        </a>
        <button class="navbar-toggler menu-toggle-icon" type="button" aria-label="Open navigation" aria-expanded="false" data-menu-toggle>

        <div class="collapse navbar-collapse" data-menu>
          <ul class="navbar-nav mx-auto gap-lg-1">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>

          <button class="btn btn-sm btn-outline-brand rounded-circle d-inline-flex align-items-center justify-content-center me-lg-2" style="width:38px;height:38px" type="button" data-theme aria-label="Toggle light and dark mode" title="Toggle theme">

          <img src="assets/images/logo.png" alt="LaundryPro Logo" width="30" height="30" class="d-inline-block align-top logo-img">

        <p class="lead text-secondary">Be first to hear when we launch in your neighbourhood.</p>
        <form id="notify-form" class="d-flex gap-2 mx-auto" style="max-width:480px">
          <input class="form-control" type="email" placeholder="Email address" required>
          <button class="btn btn-brand" type="submit">Notify me</button>
        </form>
      </div>
    </main>
    <script>
      document.getElementById('notify-form').addEventListener('submit', function (event) {
        event.preventDefault();
        if (this.checkValidity()) window.location.href = 'contact-confirmation.html';
        else this.classList.add('was-validated');
      });
    </script>
    <script src="assets/js/main.js"></script>
