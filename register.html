<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create account | LaundryPro</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

    <link href="assets/css/style.css" rel="stylesheet" />
    <style>
      body.register-page {
        background: #eaf3fb;
      }

      .auth-topbar {
        position: relative;
        z-index: 10;
        padding: 18px 0 0;
      }

      .auth-topbar .container {
        max-width: 1280px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .auth-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--ink);
        font-size: clamp(2rem, 2.2vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .auth-brand img {
        width: 36px;
        height: 36px;
      }

      .auth-toggle-group {
        position: fixed;
        top: 18px;
        right: 26px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 30;
      }

      .auth-toggle-group [data-theme],
      .auth-toggle-group [data-direction] {
        border-radius: 14px;
        border: 1px solid rgba(23, 107, 223, 0.18);
        background: rgba(255, 255, 255, 0.82);
        color: var(--brand);
        box-shadow: 0 4px 14px rgba(19, 50, 92, 0.08);
      }

      .auth-toggle-group [data-theme] {
        width: 42px;
        height: 42px;
        padding: 0;
      }

      .auth-toggle-group [data-direction] {
        min-width: 92px;
        height: 42px;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 0 20px;
      }

      .register-page .auth-shell {
        min-height: calc(100vh - 60px);
        display: grid;
        place-items: center;
        padding: 40px 20px 60px;
      }

      .login-card {
        width: 100%;
        max-width: 520px;
        padding: 34px 30px 28px;
        border-radius: 28px;
        border: 1px solid rgba(17, 24, 39, 0.04);
        background: rgba(255, 255, 255, 0.8);
      }

      .brand-logo {
        font-weight: 900;
        font-size: 1.75rem;
        color: var(--ink) !important;
        text-decoration: none;
        letter-spacing: -0.02em;
      }

      .register-page .login-card .brand-logo {
        font-size: 2.25rem;
      }

      .register-page .form-control {
        height: 58px;
        border-radius: 12px;
        border-color: rgba(17, 24, 39, 0.14);
        background: #f9fafb;
        font-size: 1.1rem;
        padding: 0.8rem 1rem;
      }

      .register-page .btn-brand {
        height: 52px;
        border-radius: 12px;
        font-weight: 700;
      }

      .register-page .form-check {
        margin-top: 8px;
      }

      @media (max-width: 575.98px) {
        .auth-topbar {
          padding-top: 14px;
        }

        .auth-brand {
          font-size: 1.7rem;
        }

        .auth-toggle-group {
          top: 14px;
          right: 14px;
          gap: 8px;
        }

        .auth-toggle-group [data-direction] {
          min-width: 74px;
          padding: 0 14px;
        }

        .login-card {
          padding: 26px 20px 20px;
          border-radius: 18px;
        }

        .brand-logo {
          font-size: 1.45rem;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo-new.svg" />
  </head>
  <body class="register-page">
    <header class="auth-topbar">
      <div class="container">
      </div>
    </header>

    <div class="auth-toggle-group" aria-label="Theme and language controls">
      <button
        class="btn btn-sm btn-outline-brand rounded-circle d-inline-flex align-items-center justify-content-center"
        type="button"
        data-theme
        aria-label="Toggle light and dark mode"
        title="Toggle theme"
      >
        <span data-theme-icon aria-hidden="true">☾</span>
      </button>
      <button
        class="btn btn-sm btn-light text-brand fw-bold"
        type="button"
        data-direction
        aria-label="Switch to RTL layout"
        title="Switch to RTL layout"
      >
        RTL
      </button>
    </div>

    <main class="auth-shell">
      <div class="container py-5">
        <div class="price-card login-card mx-auto shadow-lg">
          <div class="text-center mb-4">
            <a class="brand-logo d-inline-flex align-items-center justify-content-center gap-2 text-decoration-none" href="index.html">
              <img src="assets/images/logo-new.svg" alt="LaundryPro Logo" width="32" height="32" class="logo-img">
              <span>LaundryPro</span>
            </a>
          </div>

          <div id="register-view">
            <h1 class="h3 fw-bold mb-2 text-center">Create account</h1>
            <p class="text-secondary mb-4 text-center">Sign up for seamless garment collections.</p>
            <form class="needs-validation" id="customerRegister" action="login.html" method="GET" novalidate>
              <input
                class="form-control mb-3"
                type="text"
                id="registerName"
                placeholder="Full name"
                required
              />
              <input
                class="form-control mb-3"
                type="email"
                id="registerEmail"
                placeholder="Email"
                required
              />
              <input
                class="form-control mb-3"
                type="password"
                placeholder="Password"
                required
              />
              <div class="form-check mb-3 text-start small">
                <input class="form-check-input" type="checkbox" id="termsAgree" required>
                <label class="form-check-label text-secondary" for="termsAgree">
                  I agree to the <a href="terms.html" class="text-decoration-none text-brand">Terms &amp; Conditions</a> and <a href="privacy-policy.html" class="text-decoration-none text-brand">Privacy Policy</a>
                </label>
              </div>
              <button class="btn btn-brand w-100">Create account</button>
            </form>
            <div class="d-flex align-items-center my-3">
              <hr class="flex-grow-1 my-0 text-muted">
              <span class="px-3 text-muted small">or</span>
              <hr class="flex-grow-1 my-0 text-muted">
            </div>
            <div class="d-flex flex-column gap-2 mb-3">
              <button type="button" class="btn btn-social-google w-100 d-flex align-items-center justify-content-center gap-2" onclick="handleSocialAuth('Google')">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-1.14 2.77-2.4 3.61v3h3.84c2.24-2.06 3.52-5.09 3.52-8.66Z"/>
                  <path fill="#34A853" d="M12 24c3.24 0 5.97-1.08 7.96-2.91l-3.84-3c-1.08.72-2.45 1.16-4.12 1.16-3.17 0-5.85-2.14-6.81-5.02H1.24v3.09C3.21 21.24 7.31 24 12 24Z"/>
                  <path fill="#FBBC05" d="M5.19 14.23c-.25-.72-.39-1.5-.39-2.3 0-.8.14-1.58.39-2.3V6.53H1.24C.45 8.11 0 9.94 0 12s.45 3.89 1.24 5.47l3.95-3.24Z"/>
                  <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.96 1.19 15.24 0 12 0 7.31 0 3.21 2.76 1.24 6.53l3.95 3.24c.96-2.88 3.64-5.02 6.81-5.02Z"/>
                </svg>
                <span>Continue with Google</span>
              </button>
              <button type="button" class="btn btn-social-apple w-100 d-flex align-items-center justify-content-center gap-2" onclick="handleSocialAuth('Apple')">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.33 3.918c-.37-.255-3.068-1.572-5.474.962-2.337 2.464-1.19 5.83.676 6.845 1.866 1.015 3.784-.44 4.542-1.353.076-.093.082-.11.082-.11s-.012-.007-.024-.017c-.012-.01-.735-.615-1.155-1.517-.42-.902-.206-2.039.263-2.617.47-.578 1.082-.765 1.094-.768.012-.003.018-.007.018-.007s-.05-.145-.022-.224M12.03 14.846c-1.36.435-2.22.45-3.21.015-1.077-.47-1.745-.48-2.812-.015-1.597.695-2.668-.69-3.32-1.645-.788-1.155-1.388-3.285-.295-5.185 1.08-1.884 2.56-2.742 4.015-2.7 1.077.03 1.815.5 2.505.5.69 0 1.56-.5 2.768-.425 1.485.088 2.585.83 3.09 1.558-.09.075-1.5 1.275-1.485 3.125.015 2.22 1.785 2.975 1.83 3-.045.135-1.125 3.375-3.1 3.788z"/>
                </svg>
                <span>Continue with Apple</span>
              </button>
            </div>
            <p class="mt-3 text-center mb-0 text-secondary">
              Already have an account? <a href="login.html" class="text-decoration-none fw-semibold text-brand">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/js/main.js"></script>
  </body>
</html>
