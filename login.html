<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in | LaundryPro</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

    <link href="assets/css/style.css" rel="stylesheet" />
    <style>
      .tab-btn {
        transition: all 0.25s ease;
        font-weight: 700 !important;
        border-radius: 10px !important;
        border: none !important;
      }
      .tab-btn:not(.active) {
        color: var(--muted) !important;
        background: transparent !important;
      }
      .tab-btn.active {
        background-color: var(--brand) !important;
        color: white !important;
        box-shadow: 0 4px 12px rgba(23, 107, 223, 0.2);
      }
      .tab-container {
        background-color: var(--soft);
        border: 1px solid var(--line);
        padding: 5px;
        border-radius: 14px;
      }
      .brand-logo {
        font-weight: 900;
        font-size: 1.75rem;
        color: var(--ink) !important;
        text-decoration: none;
        letter-spacing: -0.02em;
      }
      .login-logo-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(23, 107, 223, 0.1);
        color: var(--brand);
      }
      .login-logo-icon svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .login-card {
        width: 100%;
        max-width: 460px;
        padding: 40px 32px;
      }
      .login-card,
      .login-card * {
        min-width: 0;
      }
      @media (max-width: 575.98px) {
        .login-card {
          padding: 24px 20px;
          border-radius: 16px;
        }
        .brand-logo {
          font-size: 1.45rem;
          gap: 0.5rem !important;
        }
        .login-logo-icon {
          width: 42px;
          height: 42px;
          border-radius: 12px;
        }
        .login-logo-icon svg {
          width: 21px;
          height: 21px;
        }
        .tab-container {
          gap: 0 !important;
          padding: 4px;
        }
        .tab-btn {
          width: auto !important;
          flex: 1 1 0;
          font-size: 0.9rem;
        }
        .login-card .form-control,
        .login-card .btn,
        .login-card p {
          max-width: 100%;
        }
        .login-options .text-muted {
          display: none;
        }
        .login-registration {
          display: block;
          margin-top: 0.25rem;
        }
      }
    </style>
      <link rel="icon" type="image/png" href="assets/images/favicon.png" />
</head>
  <body class="bg-soft">

    <main class="min-vh-100 d-grid align-items-center">
      <div class="container py-5">
        <div class="price-card login-card mx-auto shadow-lg">
          <div class="text-center mb-4">
            <a class="brand-logo d-inline-flex align-items-center justify-content-center gap-2 text-decoration-none" href="index.html">
              <img src="assets/images/logo.png" alt="LaundryPro Logo" width="30" height="30" class="logo-img">
              <span>LaundryPro</span>
            </a>
          </div>
          
          <!-- Customer Login View -->
          <div id="user-view">
            <h1 class="h3 fw-bold mb-2">Welcome back</h1>
            <p class="text-secondary mb-4">Sign in to manage your pickups.</p>
            <form class="needs-validation" id="customerLogin" action="index.html" method="GET" novalidate>
              <input
                class="form-control mb-3"
                type="email"
                id="customerEmail"
                placeholder="Email"
                required
              />
              <input
                class="form-control mb-3"
                type="password"
                placeholder="Password"
                required
              />
              <button class="btn btn-brand w-100">Sign in</button>
            </form>
            <div class="d-flex align-items-center my-3">
              <hr class="flex-grow-1 my-0 text-muted">
              <span class="px-3 text-muted small">or</span>
              <hr class="flex-grow-1 my-0 text-muted">
            </div>
            <div class="d-flex flex-column gap-2 mb-3">
              <button type="button" class="btn btn-social-google w-100 d-flex align-items-center justify-content-center gap-2" onclick="handleSocialAuth('Google')">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-1.14 2.77-2.4 3.61v3h3.84c2.24-2.06 3.52-5.09 3.52-8.66Z"/>
                  <path fill="#34A853" d="M12 24c3.24 0 5.97-1.08 7.96-2.91l-3.84-3c-1.08.72-2.45 1.16-4.12 1.16-3.17 0-5.85-2.14-6.81-5.02H1.24v3.09C3.21 21.24 7.31 24 12 24Z"/>
                  <path fill="#FBBC05" d="M5.19 14.23c-.25-.72-.39-1.5-.39-2.3 0-.8.14-1.58.39-2.3V6.53H1.24C.45 8.11 0 9.94 0 12s.45 3.89 1.24 5.47l3.95-3.24Z"/>
                  <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.96 1.19 15.24 0 12 0 7.31 0 3.21 2.76 1.24 6.53l3.95 3.24c.96-2.88 3.64-5.02 6.81-5.02Z"/>
                </svg>
                <span>Continue with Google</span>
              </button>
              <button type="button" class="btn btn-social-apple w-100 d-flex align-items-center justify-content-center gap-2" onclick="handleSocialAuth('Apple')">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.33 3.918c-.37-.255-3.068-1.572-5.474.962-2.337 2.464-1.19 5.83.676 6.845 1.866 1.015 3.784-.44 4.542-1.353.076-.093.082-.11.082-.11s-.012-.007-.024-.017c-.012-.01-.735-.615-1.155-1.517-.42-.902-.206-2.039.263-2.617.47-.578 1.082-.765 1.094-.768.012-.003.018-.007.018-.007s-.05-.145-.022-.224M12.03 14.846c-1.36.435-2.22.45-3.21.015-1.077-.47-1.745-.48-2.812-.015-1.597.695-2.668-.69-3.32-1.645-.788-1.155-1.388-3.285-.295-5.185 1.08-1.884 2.56-2.742 4.015-2.7 1.077.03 1.815.5 2.505.5.69 0 1.56-.5 2.768-.425 1.485.088 2.585.83 3.09 1.558-.09.075-1.5 1.275-1.485 3.125.015 2.22 1.785 2.975 1.83 3-.045.135-1.125 3.375-3.1 3.788z"/>
                </svg>
                <span>Continue with Apple</span>
              </button>
            </div>
            <p class="mt-3 text-center mb-0 login-options">
              <a href="forgot-password.html" class="text-decoration-none">Forgot password?</a>
              <span class="text-muted mx-2">•</span>
              <span class="login-registration">New here? <a href="register.html" class="text-decoration-none fw-semibold">Create account</a></span>
            </p>
          </div>
        </div>
      </div>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
