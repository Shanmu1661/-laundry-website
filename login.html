<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Sign in to your LaundryPro account." />
    <title>Sign in | LaundryPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="assets/images/logo-new.svg" />
  </head>
  <body class="login-page">
    <div class="login-controls" aria-label="Display settings">
      <button type="button" data-theme aria-label="Toggle light and dark mode" title="Toggle theme"><span data-theme-icon aria-hidden="true">☾</span></button>
      <button type="button" data-direction aria-label="Switch to RTL layout" title="Switch to RTL layout">RTL</button>
    </div>
    <main class="login-main">
      <section class="login-panel" aria-labelledby="login-title">
        <a class="login-brand" href="index.html" aria-label="LaundryPro home">
          <span class="login-brand-mark"><img src="assets/images/logo-new.svg" alt="" /></span>
          <span>LaundryPro</span>
        </a>

        <div class="login-intro">
          <span class="login-kicker">Welcome back</span>
          <h1 id="login-title">Fresh care is just a sign-in away.</h1>
          <p>Manage pickups, track orders, and keep every wardrobe feeling its best.</p>
        </div>

        <form class="needs-validation login-form" id="customerLogin" action="index.html" method="GET" novalidate>
          <div class="mb-3">
            <label class="form-label" for="customerEmail">Email address</label>
            <input class="form-control" type="email" id="customerEmail" placeholder="you@example.com" autocomplete="email" required />
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>
          <div>
            <label class="form-label" for="customerPassword">Password</label>
            <input class="form-control" type="password" id="customerPassword" placeholder="Enter your password" autocomplete="current-password" required />
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
          <div class="login-form-options">
            <label class="form-check login-remember">
              <input class="form-check-input" type="checkbox" name="remember" />
              <span class="form-check-label">Remember me</span>
            </label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>
          <button class="btn btn-brand login-submit" type="submit">Sign in <i class="fa-solid fa-arrow-right ms-2" aria-hidden="true"></i></button>
        </form>

        <div class="login-divider"><span>or continue with</span></div>
        <div class="login-socials">
          <button type="button" class="btn btn-social-google" onclick="handleSocialAuth('Google')" aria-label="Continue with Google"><i class="fa-brands fa-google" aria-hidden="true"></i><span>Google</span></button>
          <button type="button" class="btn btn-social-apple" onclick="handleSocialAuth('Apple')" aria-label="Continue with Apple"><i class="fa-brands fa-apple" aria-hidden="true"></i><span>Apple</span></button>
        </div>
        <p class="login-signup">New to LaundryPro? <a href="register.html">Create an account</a></p>
      </section>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
