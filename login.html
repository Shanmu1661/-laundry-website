<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Sign in to your LaundryPro account." />
    <title>Sign in | LaundryPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="assets/images/logo-new.svg" />
  </head>
  <body class="login-page">
    <div class="login-controls" aria-label="Display settings">
      <button type="button" data-theme aria-label="Toggle light and dark mode" title="Toggle theme"><span data-theme-icon aria-hidden="true">☾</span></button>
      <button type="button" data-direction aria-label="Switch to RTL layout" title="Switch to RTL layout">RTL</button>
    </div>
    <main class="login-main">
      <section class="login-panel" aria-labelledby="login-title">
        <a class="login-brand" href="index.html" aria-label="LaundryPro home">
          <span class="login-brand-mark"><img src="assets/images/logo-new.svg" alt="" /></span>
          <span>LaundryPro</span>
        </a>

        <div class="login-intro">
          <span class="login-kicker">Welcome back</span>
          <h1 id="login-title">Fresh care is just a sign-in away.</h1>
          <p>Manage pickups, track orders, and keep every wardrobe feeling its best.</p>
        </div>

        <form class="needs-validation login-form" id="customerLogin" action="index.html" method="GET" novalidate>
          <div class="mb-3">
            <label class="form-label" for="customerEmail">Email address</label>
            <input class="form-control" type="email" id="customerEmail" placeholder="you@example.com" autocomplete="email" required />
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>
          <div>
            <label class="form-label" for="customerPassword">Password</label>
            <input class="form-control" type="password" id="customerPassword" placeholder="Enter your password" autocomplete="current-password" required />
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
          <div class="login-form-options">
            <label class="form-check login-remember">
              <input class="form-check-input" type="checkbox" name="remember" />
              <span class="form-check-label">Remember me</span>
            </label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>
          <button class="btn btn-brand login-submit" type="submit">Sign in <i class="fa-solid fa-arrow-right ms-2" aria-hidden="true"></i></button>
        </form>

        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1 my-0 text-muted">
          <span class="px-3 text-muted small">or</span>
          <hr class="flex-grow-1 my-0 text-muted">
        </div>
        <div class="d-flex flex-column gap-2 mb-3">
          <button type="button" class="btn btn-social-google w-100 d-flex align-items-center justify-content-center gap-2" onclick="handleSocialAuth('Google')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-1.14 2.77-2.4 3.61v3h3.84c2.24-2.06 3.52-5.09 3.52-8.66Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.97-1.08 7.96-2.91l-3.84-3c-1.08.72-2.45 1.16-4.12 1.16-3.17 0-5.85-2.14-6.81-5.02H1.24v3.09C3.21 21.24 7.31 24 12 24Z"/>
              <path fill="#FBBC05" d="M5.19 14.23c-.25-.72-.39-1.5-.39-2.3 0-.8.14-1.58.39-2.3V6.53H1.24C.45 8.11 0 9.94 0 12s.45 3.89 1.24 5.47l3.95-3.24Z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.96 1.19 15.24 0 12 0 7.31 0 3.21 2.76 1.24 6.53l3.95 3.24c.96-2.88 3.64-5.02 6.81-5.02Z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
          <button type="button" class="btn btn-social-apple w-100 d-flex align-items-center justify-content-center gap-2" onclick="handleSocialAuth('Apple')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.33 3.918c-.37-.255-3.068-1.572-5.474.962-2.337 2.464-1.19 5.83.676 6.845 1.866 1.015 3.784-.44 4.542-1.353.076-.093.082-.11.082-.11s-.012-.007-.024-.017c-.012-.01-.735-.615-1.155-1.517-.42-.902-.206-2.039.263-2.617.47-.578 1.082-.765 1.094-.768.012-.003.018-.007.018-.007s-.05-.145-.022-.224M12.03 14.846c-1.36.435-2.22.45-3.21.015-1.077-.47-1.745-.48-2.812-.015-1.597.695-2.668-.69-3.32-1.645-.788-1.155-1.388-3.285-.295-5.185 1.08-1.884 2.56-2.742 4.015-2.7 1.077.03 1.815.5 2.505.5.69 0 1.56-.5 2.768-.425 1.485.088 2.585.83 3.09 1.558-.09.075-1.5 1.275-1.485 3.125.015 2.22 1.785 2.975 1.83 3-.045.135-1.125 3.375-3.1 3.788z"/>
            </svg>
            <span>Continue with Apple</span>
          </button>
        </div>
        <p class="login-signup">New to LaundryPro? <a href="register.html">Create an account</a></p>
      </section>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
