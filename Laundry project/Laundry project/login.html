<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in | LaundryPro</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
    <style>
      .tab-btn {
        transition: all 0.25s ease;
        font-weight: 700 !important;
        border-radius: 10px !important;
        border: none !important;
      }
      .tab-btn:not(.active) {
        color: var(--muted) !important;
        background: transparent !important;
      }
      .tab-btn.active {
        background-color: var(--brand) !important;
        color: white !important;
        box-shadow: 0 4px 12px rgba(23, 107, 223, 0.2);
      }
      .tab-container {
        background-color: var(--soft);
        border: 1px solid var(--line);
        padding: 5px;
        border-radius: 14px;
      }
      .brand-logo {
        font-weight: 900;
        font-size: 1.75rem;
        color: var(--ink) !important;
        text-decoration: none;
        letter-spacing: -0.02em;
      }
      .login-logo-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(23, 107, 223, 0.1);
        color: var(--brand);
      }
      .login-logo-icon svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .login-card {
        width: 100%;
        max-width: 460px;
        padding: 40px 32px;
      }
      .login-card,
      .login-card * {
        min-width: 0;
      }
      @media (max-width: 575.98px) {
        .login-card {
          padding: 24px 20px;
          border-radius: 16px;
        }
        .brand-logo {
          font-size: 1.45rem;
          gap: 0.5rem !important;
        }
        .login-logo-icon {
          width: 42px;
          height: 42px;
          border-radius: 12px;
        }
        .login-logo-icon svg {
          width: 21px;
          height: 21px;
        }
        .tab-container {
          gap: 0 !important;
          padding: 4px;
        }
        .tab-btn {
          width: auto !important;
          flex: 1 1 0;
          font-size: 0.9rem;
        }
        .login-card .form-control,
        .login-card .btn,
        .login-card p {
          max-width: 100%;
        }
        .login-options .text-muted {
          display: none;
        }
        .login-registration {
          display: block;
          margin-top: 0.25rem;
        }
      }
    </style>
      <link rel="icon" type="image/png" href="assets/images/favicon.png" />
</head>
  <body class="bg-soft">

    <main class="min-vh-100 d-grid align-items-center">
      <div class="container py-5">
        <div class="price-card login-card mx-auto shadow-lg">
          <div class="text-center mb-4">
            <a class="brand-logo d-inline-flex align-items-center gap-2" href="index.html">
              <span class="login-logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 2a2 2 0 0 0-2 2v2H7a3 3 0 0 0-3 3v3h2V9a1 1 0 0 1 1-1h3v2a2 2 0 0 0 2 2h2v2h-2a2 2 0 0 0-2 2v2H8v2h4v2a2 2 0 0 0 4 0v-2h2v-2h-2v-2a2 2 0 0 0-2-2h-2v-2h2a2 2 0 0 0 2-2V9a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v3h2V9a3 3 0 0 0-3-3h-3V4a2 2 0 0 0-2-2z" />
                </svg>
              </span>
              <span>LaundryPro</span>
            </a>
          </div>
          
          <!-- Tab Switcher -->
          <div class="d-flex gap-1 tab-container mb-4">
            <button
              type="button"
              id="tab-user"
              class="btn btn-sm w-50 tab-btn active"
              onclick="switchTab('user')"
            >
              Customer
            </button>
            <button
              type="button"
              id="tab-admin"
              class="btn btn-sm w-50 tab-btn"
              onclick="switchTab('admin')"
            >
              Admin
            </button>
          </div>

          <!-- Customer Login View -->
          <div id="user-view">
            <h1 class="h3 fw-bold mb-2">Welcome back</h1>
            <p class="text-secondary mb-4">Sign in to manage your pickups.</p>
            <form class="needs-validation" id="customerLogin" action="user-dashboard.html" method="GET" novalidate>
              <input
                class="form-control mb-3"
                type="email"
                id="customerEmail"
                placeholder="Email"
                required
              />
              <input
                class="form-control mb-3"
                type="password"
                placeholder="Password"
                required
              />
              <button class="btn btn-brand w-100">Sign in</button>
            </form>
            <p class="mt-3 text-center mb-0 login-options">
              <a href="forgot-password.html" class="text-decoration-none">Forgot password?</a>
              <span class="text-muted mx-2">•</span>
              <span class="login-registration">New here? <a href="register.html" class="text-decoration-none fw-semibold">Create account</a></span>
            </p>
          </div>

          <!-- Admin Login View -->
          <div id="admin-view" style="display: none;">
            <h1 class="h3 fw-bold mb-2">Admin Portal</h1>
            <p class="text-secondary mb-4">Access the admin dashboard.</p>
            <form class="needs-validation" action="admin.html" method="GET" novalidate>
              <input
                class="form-control mb-3"
                type="email"
                placeholder="Admin Email"
                value="laundry@gmail.com"
                required
              />
              <input
                class="form-control mb-3"
                type="password"
                placeholder="Password"
                value="admin@123"
                required
              />
              <button class="btn btn-brand w-100">Admin Sign in</button>
            </form>
            <div class="alert alert-info small mt-3" role="alert">
              Demo admin credentials: <strong>laundry@gmail.com</strong> / <strong>admin@123</strong>
            </div>
            <p class="mt-2 text-secondary text-center small mb-0">
              Authorized admin access only.
            </p>
          </div>
        </div>
      </div>
    </main>

    <script>
      function switchTab(type) {
        const userTab = document.getElementById('tab-user');
        const adminTab = document.getElementById('tab-admin');
        const userView = document.getElementById('user-view');
        const adminView = document.getElementById('admin-view');

        if (type === 'user') {
          userTab.classList.add('active');
          adminTab.classList.remove('active');
          userView.style.display = 'block';
          adminView.style.display = 'none';
        } else {
          adminTab.classList.add('active');
          userTab.classList.remove('active');
          adminView.style.display = 'block';
          userView.style.display = 'none';
        }
      }
    </script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
